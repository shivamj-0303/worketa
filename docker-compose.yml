version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: worketa
      POSTGRES_PASSWORD: worketa
      POSTGRES_DB: worketa
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/worketa
      SPRING_DATASOURCE_USERNAME: worketa
      SPRING_DATASOURCE_PASSWORD: worketa
    ports:
      - '8080:8080'

volumes:
  db-data:
