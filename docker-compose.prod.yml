version: '3.9'

services:
  postgres:
    image: postgres:14-alpine
    container_name: worketa-db-prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: worketa
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - worketa-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  worketa-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worketa-api-prod
    environment:
      # Database
      DB_URL: jdbc:postgresql://postgres:5432/worketa
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres}
      DB_POOL_SIZE: 20
      DB_MIN_IDLE: 5
      
      # JWT Security - CRITICAL: Change these in production!
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: 900000      # 15 minutes
      JWT_REFRESH_EXPIRATION: 604800000  # 7 days
      
      # Server
      PORT: 8080
      LOG_DIR: /var/log/worketa
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - worketa_logs:/var/log/worketa
    networks:
      - worketa-network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data_prod:
    driver: local
  worketa_logs:
    driver: local

networks:
  worketa-network:
    driver: bridge
