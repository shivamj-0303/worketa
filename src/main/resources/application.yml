spring:
  application:
    name: worketa

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/worketa}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  flyway:
    enabled: true
    locations: classpath:db/migration

worketa:
  seed:
    demo-data: false

security:
  jwt:
    secret: ${JWT_SECRET:qbiR4yZrqqTAyljJd5rTSRttBps5gF6iPPdrUosVb0C}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}

server:
  port: ${PORT:8080}