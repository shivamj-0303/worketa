
spring.application.name=worketa

# Datasource (dev override via env)
spring.datasource.url=jdbc:postgresql://localhost:5432/worketa
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - IMPORTANT: use validate in prod, migrations via Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# JWT defaults - override in prod with strong secret
security.jwt.secret=change-me-please-change-in-prod-should-be-very-long
security.jwt.access-token-expiration-ms=900000
security.jwt.refresh-token-expiration-ms=604800000

# Disable Spring Security auto-config (we use JWT)
spring.security.user.name=notused
spring.security.user.password=notused
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

