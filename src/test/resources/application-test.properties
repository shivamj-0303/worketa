spring.application.name=worketa

# Datasource (in-memory for tests, will use testcontainers in integration tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway for unit tests
spring.flyway.enabled=false

# JWT
security.jwt.secret=test-secret-change-in-prod-should-be-very-long
security.jwt.access-token-expiration-ms=900000
security.jwt.refresh-token-expiration-ms=604800000
